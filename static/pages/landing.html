<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMEL SPX • منصة تداول SPX الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --cyan:#00E5FF; --purple:#9B6CFF;
  --bg:#04060B; --text:#F5F7FF;
  --f-display:'Orbitron', sans-serif;
  --f-body:'Cairo', sans-serif;
  --f-tech:'Rajdhani', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--f-body);background:var(--bg);color:var(--text);overflow-x:hidden}
body{
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,229,255,0.10), transparent 60%),
    radial-gradient(ellipse 70% 50% at 30% 100%, rgba(155,108,255,0.06), transparent 60%),
    linear-gradient(180deg, #04060B 0%, #080C18 100%);
}
.hero{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
}
.mark{
  width:96px;height:96px;border-radius:24px;
  background:linear-gradient(135deg, rgba(0,229,255,0.20), rgba(155,108,255,0.15));
  border:1px solid rgba(0,229,255,0.35);
  display:flex;align-items:center;justify-content:center;color:var(--cyan);
  box-shadow:0 0 40px -6px rgba(0,229,255,0.55), 0 0 100px -10px rgba(0,229,255,0.3);
  margin-bottom:32px;
}
.mark svg{width:56px;height:56px}
.eyebrow{
  font-family:var(--f-tech);font-weight:700;font-size:12px;letter-spacing:4px;
  color:var(--cyan);text-transform:uppercase;margin-bottom:16px;
}
h1{
  font-family:var(--f-display);font-weight:900;font-size:clamp(36px, 8vw, 72px);
  letter-spacing:-1px;line-height:1.1;margin-bottom:18px;
  background:linear-gradient(135deg, #F5F7FF, #00E5FF, #9B6CFF);
  background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shimmer 4s linear infinite;
}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
p.lead{
  font-size:clamp(15px, 2.4vw, 19px);color:rgba(245,247,255,0.7);
  max-width:680px;line-height:1.7;margin-bottom:40px;
}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 32px;border-radius:12px;
  font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:1.5px;
  text-decoration:none;text-transform:uppercase;
  transition:all 0.2s;
}
.cta-primary{
  background:linear-gradient(135deg, #00E5FF, #0099BB);color:#04060B;
  box-shadow:0 12px 30px -8px rgba(0,229,255,0.5);
}
.cta-primary:hover{transform:translateY(-2px);box-shadow:0 18px 40px -8px rgba(0,229,255,0.6)}
.cta-ghost{
  background:rgba(255,255,255,0.03);color:var(--text);
  border:1px solid rgba(255,255,255,0.1);
}
.cta-ghost:hover{background:rgba(255,255,255,0.08);border-color:rgba(0,229,255,0.3)}
.foot{
  position:absolute;bottom:24px;left:0;right:0;text-align:center;
  font-family:var(--f-tech);font-size:11px;letter-spacing:2.5px;
  color:rgba(245,247,255,0.35);text-transform:uppercase;
}
</style>

<script>
  // If a session exists, swap the primary CTA to point straight into the app.
  document.addEventListener('DOMContentLoaded', function(){
    try{
      if(sessionStorage.getItem('camelspx_user')){
        const cta = document.querySelector('a.cta-primary');
        if(cta){
          cta.setAttribute('href','app.html');
          cta.textContent = 'متابعة إلى اللوحة';
        }
      }
    }catch(_){}
  });
</script>
<style id="camel-base">
:root{
  --surface-0:#04060B;--surface-1:#080C18;--surface-2:#0E1426;

             linear-gradient(180deg, #04060B 0%, #080C18 50%, #04060B 100%);

html,body{
  margin:0;padding:0;min-height:100%;
  background:var(--bg-grad);
  color:var(--text-primary);
  font-family:'Cairo','Segoe UI',sans-serif;

body::-webkit-scrollbar{width:8px;height:8px}
body::-webkit-scrollbar-track{background:transparent}
body::-webkit-scrollbar-thumb{background:rgba(127,127,127,0.18);border-radius:4px}
body::-webkit-scrollbar-thumb:hover{background:rgba(127,127,127,0.32)}
h1,h2,h3,h4,h5,h6,p,span,div,label,td,th,li,a{color:inherit}
a{color:var(--cyan);text-decoration:none}
input,select,textarea,button{font-family:inherit;color:inherit}

/* ─── Light scheme via filter inversion ─────────────────────────────
   The inner pages have many hardcoded dark surfaces (rgba(0,0,0,X), hex
   navys) in their own <style> blocks that CSS overrides can't reach.
   Inverting the whole body with hue-rotate(180°) flips every dark area
   to light while keeping colourful accents (cyan stays cyan, gold stays
   gold) because hue-rotate cancels the hue shift from the invert.
   Real images are re-inverted so photographs stay correct.
   ────────────────────────────────────────────────────────────────── */
html[data-scheme="light"] body{
  filter:invert(0.93) hue-rotate(180deg);
}
html[data-scheme="light"] img,
html[data-scheme="light"] video,
html[data-scheme="light"] picture,
html[data-scheme="light"] svg image,
html[data-scheme="light"] [style*="background-image:url"],
html[data-scheme="light"] [style*="background-image: url"],
html[data-scheme="light"] [style*="background:url"]{
  filter:invert(1) hue-rotate(180deg);
}
</style>
<script>
/* Listen for theme + scheme changes from the parent shell and apply live. */
(function(){
  function applyVars(vars){
    if(!vars) return;
    for(var k in vars){ document.documentElement.style.setProperty(k, vars[k]); }
  }
  window.addEventListener('message', function(e){
    var d = e && e.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'camel:apply-theme'){
      applyVars(d.vars);
      if(d.themeKey) document.documentElement.dataset.activeTheme = d.themeKey;
    } else if(d.type === 'camel:apply-scheme' && (d.scheme === 'dark' || d.scheme === 'light')){
      document.documentElement.dataset.scheme = d.scheme;
    }
  });
})();
</script>
