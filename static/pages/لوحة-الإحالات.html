<style>
/* ─── Cross-page additions (do not exist in the original) ─── */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px;flex-wrap:wrap}
.ph-left{flex:1;min-width:0}
.ph-eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-tech, 'Rajdhani', sans-serif);font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--cyan, #00E5FF);margin-bottom:8px}
.ph-eyebrow svg{width:13px;height:13px}
.ph-eyebrow--gold{color:var(--gold, #F5C95C)!important}
.ph-eyebrow--gold svg{color:var(--gold, #F5C95C)!important}
.ph-eyebrow--purple{color:#C8A8FF!important}
.ph-eyebrow--purple svg{color:#C8A8FF!important}
.ph-title{font-family:var(--f-display, 'Orbitron', sans-serif);font-weight:800;font-size:34px;letter-spacing:-0.5px;color:var(--text-primary, #F5F7FF);margin:0 0 8px}
.ph-sub{font-size:14px;color:var(--text-secondary, rgba(245,247,255,0.6));line-height:1.6;max-width:760px;margin:0}
.ph-sub strong{color:var(--text-primary);font-weight:700}
.ph-actions{display:flex;gap:10px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-family:var(--f-display, 'Orbitron');font-weight:700;font-size:12.5px;letter-spacing:0.6px;cursor:pointer;border:1px solid transparent;transition:transform 0.15s, box-shadow 0.2s, background 0.2s;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn-primary{background:linear-gradient(135deg,#00E5FF,#0099BB);color:#04060B;box-shadow:0 8px 24px -8px rgba(0,229,255,0.5)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,#F5C95C,#C99528);color:#08060B;box-shadow:0 8px 24px -8px rgba(245,201,92,0.5)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-purple{background:linear-gradient(135deg,#9B6CFF,#6940CC);color:#FFF;box-shadow:0 8px 24px -8px rgba(155,108,255,0.5)}
.btn-purple:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,0.03);color:var(--text-primary);border:1px solid rgba(255,255,255,0.1)}
.btn-ghost:hover{background:rgba(255,255,255,0.06);border-color:rgba(0,229,255,0.3)}
.btn-profit{background:linear-gradient(135deg,#00FF94,#00A862);color:#04060B}
.btn-loss{background:linear-gradient(135deg,#FF3D5C,#A02234);color:#FFF}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-sm svg{width:12px;height:12px}

.kpi-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi-grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--glass, rgba(20,28,52,0.45));border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:18px;position:relative;overflow:hidden;backdrop-filter:blur(20px) saturate(140%)}
.kpi::before{content:'';position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,var(--kpi-line, rgba(0,229,255,0.4)),transparent)}
.kpi--cyan{--kpi-line:rgba(0,229,255,0.5)}
.kpi--gold{--kpi-line:rgba(245,201,92,0.5)}
.kpi--purple{--kpi-line:rgba(155,108,255,0.5)}
.kpi--profit{--kpi-line:rgba(0,255,148,0.5)}
.kpi--loss{--kpi-line:rgba(255,61,92,0.5)}
.kpi--warn{--kpi-line:rgba(255,184,0,0.5)}
.kpi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kpi-label{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--text-tertiary, rgba(245,247,255,0.4));font-family:var(--f-tech, 'Rajdhani');letter-spacing:0.6px;text-transform:uppercase}
.kpi-icon{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:6px;background:rgba(255,255,255,0.04)}
.kpi-icon svg{width:13px;height:13px;color:var(--text-secondary)}
.kpi-value{font-family:var(--f-display, 'Orbitron');font-weight:800;font-size:30px;letter-spacing:-0.5px;color:var(--text-primary);line-height:1.1}
.kpi-value .unit{font-size:13px;color:var(--text-tertiary);margin-right:4px;font-weight:600}
.kpi-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:6px;font-family:var(--f-mono, 'JetBrains Mono')}
.kpi-sub strong{color:var(--text-secondary);font-weight:700}

.panel{background:var(--glass);border:1px solid rgba(255,255,255,0.06);border-radius:14px;backdrop-filter:blur(20px) saturate(140%);overflow:hidden;margin-bottom:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.05)}
.panel-title{display:flex;align-items:center;gap:10px;font-family:var(--f-display, 'Orbitron');font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-primary)}
.panel-title svg{width:16px;height:16px;color:var(--cyan, #00E5FF)}
.panel-title .pill{font-family:var(--f-tech, 'Rajdhani');font-size:10px;padding:4px 8px;border-radius:5px;letter-spacing:2px;background:rgba(0,229,255,0.08);color:var(--cyan);border:1px solid rgba(0,229,255,0.2);text-transform:uppercase}
.panel-actions{display:flex;gap:8px}
.panel-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:7px;color:var(--text-secondary);font-size:11.5px;font-weight:600;cursor:pointer}
.panel-chip svg{width:11px;height:11px}
.panel-chip:hover{border-color:rgba(0,229,255,0.3);color:var(--cyan)}
.panel-body{padding:20px}

.dtable{width:100%;border-collapse:collapse}
.dtable thead th{padding:11px 16px;text-align:right;font-family:var(--f-tech, 'Rajdhani');font-size:10.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-tertiary);border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.18)}
.dtable tbody td{padding:13px 16px;font-size:13px;color:var(--text-secondary);border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
.dtable tbody tr:hover{background:rgba(0,229,255,0.025)}
.cell-id{font-family:var(--f-mono);font-weight:700;color:var(--text-primary);font-size:12px}
.cell-mono{font-family:var(--f-mono);font-size:12.5px;color:var(--text-secondary)}
.cell-pnl{font-family:var(--f-mono);font-weight:700}
.cell-pnl.up{color:var(--profit, #00FF94)}
.cell-pnl.down{color:var(--loss, #FF3D5C)}
.cell-user{display:flex;align-items:center;gap:10px}
.ava{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,rgba(0,229,255,0.18),rgba(155,108,255,0.18));border:1px solid rgba(255,255,255,0.08);color:var(--text-primary);font-family:var(--f-display);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ucol{display:flex;flex-direction:column;line-height:1.3}
.ucol b{color:var(--text-primary);font-size:13px;font-weight:700}
.ucol span{color:var(--text-tertiary);font-size:11px;font-family:var(--f-mono)}

.badge-status{display:inline-block;padding:4px 9px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:0.5px;font-family:var(--f-tech)}
.s-active{background:rgba(0,255,148,0.1);color:var(--profit);border:1px solid rgba(0,255,148,0.3)}
.s-pending{background:rgba(255,184,0,0.1);color:#FFB800;border:1px solid rgba(255,184,0,0.3)}
.s-rejected{background:rgba(255,61,92,0.1);color:var(--loss);border:1px solid rgba(255,61,92,0.3)}
.badge-side{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:10.5px;letter-spacing:1px}
.badge-side svg{width:10px;height:10px}
.badge-side.call{background:rgba(0,255,148,0.1);color:var(--profit);border:1px solid rgba(0,255,148,0.3)}
.badge-side.put{background:rgba(255,61,92,0.1);color:var(--loss);border:1px solid rgba(255,61,92,0.3)}

.row-acts{display:flex;gap:6px;justify-content:flex-end}
.row-act{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:7px;color:var(--text-tertiary);cursor:pointer;transition:all 0.16s}

.row-act.danger:hover{color:var(--loss);border-color:rgba(255,61,92,0.4)}
.row-act.success:hover{color:var(--profit);border-color:rgba(0,255,148,0.4)}
.row-act.gold:hover{color:var(--gold);border-color:rgba(245,201,92,0.4)}

.fstrip{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:11px 16px;margin-bottom:18px;backdrop-filter:blur(20px)}
.fstrip-label{display:flex;align-items:center;gap:6px;font-family:var(--f-tech);font-size:11px;color:var(--text-tertiary);letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.fstrip-label svg{color:var(--cyan)}
.pill-group{display:flex;gap:4px;background:rgba(0,0,0,0.22);padding:4px;border-radius:9px}
.pill-btn{padding:7px 14px;background:transparent;border:none;color:var(--text-tertiary);font-family:var(--f-tech);font-weight:600;font-size:12px;letter-spacing:0.5px;border-radius:6px;cursor:pointer;transition:all 0.18s}
.pill-btn:hover{color:var(--text-primary)}
.pill-btn.active{background:rgba(0,229,255,0.12);color:var(--cyan);box-shadow:0 0 0 1px rgba(0,229,255,0.25)}
.fstrip-search{margin-right:auto;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.05);border-radius:9px;padding:6px 12px;min-width:280px}
.fstrip-search svg{width:14px;height:14px;color:var(--text-tertiary)}
.fstrip-search input{flex:1;background:transparent;border:none;outline:none;color:var(--text-primary);font-size:13px;font-family:var(--f-body, 'Cairo')}

.notice{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-radius:12px;margin-bottom:18px;position:relative;background:var(--glass);border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(20px)}
.notice-bar{position:absolute;top:0;right:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.notice-icon{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.notice-icon svg{width:16px;height:16px}
.notice-body{flex:1;min-width:0}
.notice-title{font-weight:700;color:var(--text-primary);font-size:13.5px;margin-bottom:3px}
.notice-text{font-size:12.5px;color:var(--text-secondary);line-height:1.6}
.notice-info .notice-bar{background:var(--cyan)}
.notice-info .notice-icon{background:rgba(0,229,255,0.08);color:var(--cyan)}
.notice-warn .notice-bar{background:#FFB800}
.notice-warn .notice-icon{background:rgba(255,184,0,0.08);color:#FFB800}
.notice-rule .notice-bar{background:var(--gold)}
.notice-rule .notice-icon{background:rgba(245,201,92,0.08);color:var(--gold)}

.field{margin-bottom:14px}
.field-label{display:block;font-family:var(--f-tech);font-size:11px;color:var(--text-tertiary);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.field-hint{color:var(--text-tertiary);font-size:11px;font-weight:400;margin-right:8px;text-transform:none;letter-spacing:0}
.input,.select,.textarea{width:100%;background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.06);border-radius:9px;padding:11px 14px;color:var(--text-primary);font-size:13px;font-family:var(--f-body, 'Cairo');outline:none;transition:border 0.18s}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(0,229,255,0.35)}
.textarea{resize:vertical;font-family:var(--f-body)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.toggle{position:relative;display:inline-block;width:44px;height:22px;flex-shrink:0;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:22px;transition:0.2s}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;right:3px;top:2px;background:#FFF;border-radius:50%;transition:0.2s}
.toggle input:checked + .toggle-slider{background:linear-gradient(135deg,#00E5FF,#0099BB);border-color:rgba(0,229,255,0.3)}
.toggle input:checked + .toggle-slider::before{transform:translateX(-22px)}
.toggle-row{display:flex;align-items:flex-start;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.toggle-row:last-child{border-bottom:none}
.toggle-text{flex:1}
.toggle-title{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:2px}
.toggle-sub{font-size:11.5px;color:var(--text-tertiary)}

.fade-in{animation:fade-up .5s ease-out both}
.fade-in.d1{animation-delay:.08s}
.fade-in.d2{animation-delay:.16s}
.fade-in.d3{animation-delay:.24s}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Container for new pages — content area only */
.page-wrap{padding:28px 32px;max-width:1500px;margin:0 auto}

<style id="camel-base">
:root{
  --surface-0:#04060B;--surface-1:#080C18;--surface-2:#0E1426;
  --glass:rgba(20,28,52,0.65);--glass-strong:rgba(12,18,38,0.88);
  --cyan:#00E5FF;--cyan-soft:rgba(0,229,255,0.1);--cyan-dim:#0099BB;
  --purple:#9B6CFF;--purple-soft:rgba(155,108,255,0.12);
  --gold:#F5C95C;--profit:#00FF94;--loss:#FF3D5C;
  --text-primary:#F5F7FF;--text-secondary:rgba(245,247,255,0.65);
  --text-tertiary:rgba(245,247,255,0.38);--text-muted:rgba(245,247,255,0.25);
  --border:rgba(255,255,255,0.06);--border-bright:rgba(255,255,255,0.12);
  --f-display:'Orbitron',sans-serif;--f-body:'Cairo',sans-serif;
  --f-mono:'JetBrains Mono',monospace;--f-tech:'Rajdhani',sans-serif;
  --bg-grad: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,229,255,0.06), transparent 60%),
             radial-gradient(ellipse 70% 50% at 80% 100%, rgba(155,108,255,0.04), transparent 60%),
             linear-gradient(180deg, #04060B 0%, #080C18 50%, #04060B 100%);
}
html,body{
  margin:0;padding:0;min-height:100%;
  background:var(--bg-grad);
  color:var(--text-primary);
  font-family:'Cairo','Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background 0.3s ease, color 0.3s ease;
}
body::-webkit-scrollbar{width:8px;height:8px}
body::-webkit-scrollbar-track{background:transparent}
body::-webkit-scrollbar-thumb{background:rgba(127,127,127,0.18);border-radius:4px}
body::-webkit-scrollbar-thumb:hover{background:rgba(127,127,127,0.32)}
h1,h2,h3,h4,h5,h6,p,span,div,label,td,th,li,a{color:inherit}
a{color:var(--cyan);text-decoration:none}
input,select,textarea,button{font-family:inherit;color:inherit}

/* ─── Light scheme via filter inversion ─────────────────────────────
   The inner pages have many hardcoded dark surfaces (rgba(0,0,0,X), hex
   navys) in their own <style> blocks that CSS overrides can't reach.
   Inverting the whole body with hue-rotate(180°) flips every dark area
   to light while keeping colourful accents (cyan stays cyan, gold stays
   gold) because hue-rotate cancels the hue shift from the invert.
   Real images are re-inverted so photographs stay correct.
   ────────────────────────────────────────────────────────────────── */
html[data-scheme="light"] body{
  filter:invert(0.93) hue-rotate(180deg);
}
html[data-scheme="light"] img,
html[data-scheme="light"] video,
html[data-scheme="light"] picture,
html[data-scheme="light"] svg image,
html[data-scheme="light"] [style*="background-image:url"],
html[data-scheme="light"] [style*="background-image: url"],
html[data-scheme="light"] [style*="background:url"]{
  filter:invert(1) hue-rotate(180deg);
}
</style>
<script>
/* Listen for theme + scheme changes from the parent shell and apply live. */
(function(){
  function applyVars(vars){
    if(!vars) return;
    for(var k in vars){ document.documentElement.style.setProperty(k, vars[k]); }
  }
  window.addEventListener('message', function(e){
    var d = e && e.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'camel:apply-theme'){
      applyVars(d.vars);
      if(d.themeKey) document.documentElement.dataset.activeTheme = d.themeKey;
    } else if(d.type === 'camel:apply-scheme' && (d.scheme === 'dark' || d.scheme === 'light')){
      document.documentElement.dataset.scheme = d.scheme;
    }
  });
})();
</script>
</head>

<script>

(function(){
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function fmt(n){return Number(n||0).toLocaleString('en-US');}
  function ini(name){const p=(name||'').trim().split(/\s+/);return (p[0]?.[0]||'?')+(p[1]?.[0]||'');}

  async function load(){
    try{
      const res = await fetch('/api/referrals', { credentials: 'same-origin' });
      const j = await res.json();
      if(j.status !== 'ok') throw new Error(j.message || 'Bad payload');
      render(j);
    } catch(e){
      console.error('[referrals] load failed', e);
      const c = document.getElementById('refContent');
      if(c) c.innerHTML = `<div style="padding:60px;text-align:center;color:var(--loss)">فشل تحميل البيانات: ${e.message}</div>`;
    }
  }

  function render(data){
    const referrals = data.referrals || [];
    const leaders = data.leaders || [];
    const settings = data.settings || {first_time_bonus:10, renewal_bonus:3};

    // KPIs
    const kpis = document.getElementById('refKpis');
    if(kpis){
      const totalRefs = referrals.length;
      const totalBonus = referrals.length * (settings.first_time_bonus||10);
      const topName = leaders[0]?.name || leaders[0]?.username || '—';
      const topCount = leaders[0]?.referral_count || 0;
      kpis.innerHTML = `
        <div class="kpi kpi--cyan"><div class="kpi-head"><div class="kpi-label">إجمالي الإحالات</div></div>
          <div class="kpi-value">${totalRefs}</div><div class="kpi-sub">عميل دخل عبر إحالة</div></div>
        <div class="kpi kpi--profit"><div class="kpi-head"><div class="kpi-label">المُحيلين النشطين</div></div>
          <div class="kpi-value">${leaders.length}</div><div class="kpi-sub">من العملاء</div></div>
        <div class="kpi kpi--gold"><div class="kpi-head"><div class="kpi-label">المتصدر</div></div>
          <div class="kpi-value" style="font-size:18px;line-height:1.4">${esc(topName)}</div>
          <div class="kpi-sub">${topCount} إحالة</div></div>
        <div class="kpi kpi--purple"><div class="kpi-head"><div class="kpi-label">مكافأة الإحالة</div></div>
          <div class="kpi-value">${settings.first_time_bonus}<span class="unit">يوم</span></div>
          <div class="kpi-sub">للأول • ${settings.renewal_bonus} يوم للتجديد</div></div>
      `;
    }

    // Leaders table
    const ldrs = document.getElementById('refLeaders');
    if(ldrs){
      if(!leaders.length){
        ldrs.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-tertiary)">لا يوجد مُحيلين بعد</div>';
      } else {
        ldrs.innerHTML = leaders.map((l,i) => `
          <div class="ref-leader-row">
            <span class="ref-rank">${i+1}</span>
            <div class="cell-user">
              <div class="ava">${ini(l.name||l.username)}</div>
              <div class="ucol"><b>${esc(l.name||l.username||'عميل '+l.chat_id)}</b>
              <span class="cell-mono">${esc(l.referral_code||'—')}</span></div>
            </div>
            <span class="ref-count">${l.referral_count} <small>إحالة</small></span>
            <span class="ref-paid">${fmt(l.total_paid_amount)} <small>ر.س</small></span>
          </div>
        `).join('');
      }
    }

    // Full referrals list
    const list = document.getElementById('refList');
    if(list){
      if(!referrals.length){
        list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-tertiary)">لا يوجد إحالات</div>';
      } else {
        list.innerHTML = referrals.slice(0,50).map(r => `
          <div class="ref-row">
            <div class="cell-user">
              <div class="ava">${ini(r.name||r.username)}</div>
              <div class="ucol"><b>${esc(r.name||r.username||'عميل '+r.chat_id)}</b>
              <span>عبر: <span class="cell-mono">${esc(r.referred_by_code)}</span></span></div>
            </div>
            <span class="ref-pkg">${esc(r.subscription_package||'—')}</span>
            <span class="ref-by">من ${esc(r.referrer_name||r.referrer_username||'—')}</span>
            <span class="ref-paid">${fmt(r.total_paid_amount)} ر.س</span>
          </div>
        `).join('');
      }
    }
  }

  document.addEventListener('DOMContentLoaded', load);
  if(document.readyState !== 'loading') load();
})();

</script>
