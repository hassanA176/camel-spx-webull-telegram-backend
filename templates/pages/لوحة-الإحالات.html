<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMEL SPX - الإحالات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--surface-0:#04060B;--surface-1:#080C18;--glass:rgba(20,28,52,.65);--cyan:#00E5FF;--purple:#9B6CFF;--gold:#F5C95C;--profit:#00FF94;--loss:#FF3D5C;--text-primary:#F5F7FF;--text-secondary:rgba(245,247,255,.68);--text-tertiary:rgba(245,247,255,.4);--border:rgba(255,255,255,.07);--f-display:'Orbitron',sans-serif;--f-tech:'Rajdhani',sans-serif;--f-mono:'JetBrains Mono',monospace;--f-body:'Cairo',sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(155,108,255,.08),transparent 60%),linear-gradient(180deg,#04060B,#080C18 55%,#04060B);color:var(--text-primary);font-family:var(--f-body);padding:28px}.page-wrap{max-width:1500px;margin:0 auto}.ph{display:flex;justify-content:space-between;gap:22px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}.ph-eyebrow{font-family:var(--f-tech);font-weight:800;font-size:11px;letter-spacing:3px;color:#C8A8FF;text-transform:uppercase;margin-bottom:8px}.ph-title{font-family:var(--f-display);font-weight:800;font-size:34px;margin:0 0 8px}.ph-sub{margin:0;color:var(--text-secondary);font-size:14px;line-height:1.7;max-width:780px}.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--text-primary);font-weight:800;cursor:pointer;text-decoration:none}.grid{display:grid;gap:14px}.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.kpi{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:18px;backdrop-filter:blur(18px)}.kpi-label{font-family:var(--f-tech);font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--text-tertiary);text-transform:uppercase}.kpi-value{font-family:var(--f-display);font-size:28px;font-weight:800;margin-top:8px}.kpi-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:6px}.panel{background:var(--glass);border:1px solid var(--border);border-radius:14px;overflow:hidden;backdrop-filter:blur(18px);margin-bottom:18px}.panel-head{padding:16px 20px;border-bottom:1px solid var(--border);font-family:var(--f-display);font-size:13px;font-weight:800;color:var(--cyan);letter-spacing:1px}.row{display:grid;grid-template-columns:44px 1.5fr 1fr 1fr;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.045)}.row:last-child{border-bottom:0}.row:hover{background:rgba(0,229,255,.025)}.ref-row{grid-template-columns:1.5fr 1fr 1.2fr 1fr}.rank{font-family:var(--f-display);font-size:18px;font-weight:800;color:var(--gold);text-align:center}.cell-user{display:flex;align-items:center;gap:10px;min-width:0}.ava{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,rgba(0,229,255,.14),rgba(155,108,255,.2));border:1px solid rgba(255,255,255,.1);font-family:var(--f-display);font-size:11px;font-weight:800}.ucol{min-width:0}.ucol b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.ucol span,.muted{color:var(--text-tertiary);font-size:11.5px}.mono{font-family:var(--f-mono)}.pkg{color:var(--cyan);font-weight:800}.paid{font-family:var(--f-mono);font-weight:800}.chip{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:800}.chip.cashout{color:var(--cyan);background:rgba(0,229,255,.1)}.chip.discount{color:var(--gold);background:rgba(245,201,92,.1)}.chip.days{color:#C8A8FF;background:rgba(155,108,255,.12)}.empty{padding:44px;text-align:center;color:var(--text-tertiary)}@media(max-width:900px){body{padding:18px}.kpi-grid{grid-template-columns:1fr 1fr}.row,.ref-row{grid-template-columns:1fr;gap:8px}}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="ph"><div><div class="ph-eyebrow">REFERRAL PROGRAM</div><h1 class="ph-title">الإحالات</h1><p class="ph-sub">متابعة الإحالات الحقيقية حسب اختيار العميل: كاش أوت، خصم على التجديد، أو أيام إضافية.</p></div><a class="btn" href="/api/referrals/export" target="_blank">تصدير</a></div>
  <div class="grid kpi-grid" id="refKpis"></div>
  <div class="panel"><div class="panel-head">المحيلون المتصدرون</div><div id="refLeaders"></div></div>
  <div class="panel"><div class="panel-head">جميع الإحالات</div><div id="refList"></div></div>
</div>
<script>
(function(){
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function fmt(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});}
  function ini(name){const p=(name||'').trim().split(/\s+/);return (p[0]?.[0]||'?')+(p[1]?.[0]||'');}
  function rewardType(t){return ['cashout','discount','days'].includes(t)?t:'days';}
  function rewardLabel(t){return t==='cashout'?'كاش أوت':(t==='discount'?'خصم تجديد':'أيام إضافية');}
  function chip(t){const rt=rewardType(t);return `<span class="chip ${rt}">${rewardLabel(rt)}</span>`;}
  async function load(){try{const res=await fetch('/api/referrals',{credentials:'same-origin'});const data=await res.json();if(data.status!=='ok')throw new Error(data.message||'Bad payload');render(data);}catch(e){document.getElementById('refList').innerHTML=`<div class="empty" style="color:var(--loss)">فشل تحميل البيانات: ${esc(e.message)}</div>`;}}
  function render(data){const referrals=data.referrals||[],leaders=data.leaders||[],stats=data.rewardStats||{},top=leaders[0]||{};document.getElementById('refKpis').innerHTML=`<div class="kpi"><div class="kpi-label">إجمالي الإحالات</div><div class="kpi-value">${referrals.length}</div><div class="kpi-sub">عميل دخل عبر كود إحالة</div></div><div class="kpi"><div class="kpi-label">المحيلون النشطون</div><div class="kpi-value">${leaders.length}</div><div class="kpi-sub">لديهم إحالة واحدة أو أكثر</div></div><div class="kpi"><div class="kpi-label">المتصدر</div><div class="kpi-value" style="font-size:18px;line-height:1.5">${esc(top.name||top.username||'—')}</div><div class="kpi-sub">${top.referral_count||0} إحالة</div></div><div class="kpi"><div class="kpi-label">أنواع المكافآت</div><div class="kpi-value" style="font-size:17px;line-height:1.5">كاش ${stats.cashout||0} · خصم ${stats.discount||0} · أيام ${stats.days||0}</div><div class="kpi-sub">حسب اختيار أصحاب الأكواد</div></div>`;document.getElementById('refLeaders').innerHTML=leaders.length?leaders.map((l,i)=>`<div class="row"><span class="rank">${i+1}</span><div class="cell-user"><div class="ava">${ini(l.name||l.username)}</div><div class="ucol"><b>${esc(l.name||l.username||'عميل '+l.chat_id)}</b><span class="mono">${esc(l.referral_code||'—')}</span></div></div><span class="paid">${fmt(l.referral_count)} <span class="muted">إحالة</span></span>${chip(l.referral_reward_preference)}</div>`).join(''):'<div class="empty">لا يوجد محيلون بعد</div>';document.getElementById('refList').innerHTML=referrals.length?referrals.map(r=>`<div class="row ref-row"><div class="cell-user"><div class="ava">${ini(r.name||r.username)}</div><div class="ucol"><b>${esc(r.name||r.username||'عميل '+r.chat_id)}</b><span>عبر: <span class="mono">${esc(r.referred_by_code)}</span></span></div></div><span class="pkg">${esc(r.subscription_package||'—')}</span><span class="muted">من ${esc(r.referrer_name||r.referrer_username||'—')} · ${chip(r.referrer_reward_preference)}</span><span class="paid">${fmt(r.total_paid_amount)} ر.س</span></div>`).join(''):'<div class="empty">لا توجد إحالات</div>';}
  document.addEventListener('DOMContentLoaded',load);if(document.readyState!=='loading')load();
})();
</script>
</body>
</html>
